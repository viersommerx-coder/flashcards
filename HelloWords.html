<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="HelloWords">
<title>HelloWords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Noto+Serif+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2d2420;
    --paper: #fff8f0;
    --paper-deep: #fceee0;
    --accent: #e05a3a;
    --corgi-tan: #f0c080;
    --corgi-pink: #f9b8b0;
    --corgi-red: #d94030;
    --moss: #6b7c5a;
    --shadow: rgba(45, 36, 32, 0.08);
    --shadow-strong: rgba(45, 36, 32, 0.16);
    --card-warn: #fde8e4;
    --card-danger: #f9cfc8;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }

  body {
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(240,192,128,0.15), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(249,184,176,0.12), transparent 45%);
    color: var(--ink);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none;
    -webkit-user-select: none;
  }

  .app { position:relative; height:100%; display:flex; flex-direction:column; }

  /* ── HEADER ── */
  header {
    padding: 16px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Corgi SVG logo */
  .corgi-logo {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .brand-main {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .brand-sub {
    font-family: 'Noto Serif SC', serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--ink);
    opacity: 0.5;
    margin-top: 2px;
  }

  .header-actions { display:flex; gap:8px; }

  .icon-btn {
    background: none;
    border: 1px solid rgba(45,36,32,0.15);
    width: 36px; height: 36px;
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--ink);
  }
  .icon-btn:active { transform:scale(0.92); background:var(--paper-deep); }

  /* ── STATS ── */
  .stats {
    padding: 0 20px 12px;
    display: flex;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink);
    opacity: 0.55;
    text-transform: uppercase;
  }
  .stat-dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:4px; }
  .stat-dot.queue { background:var(--moss); }
  .stat-dot.review { background:var(--accent); }
  .stat-dot.done { background:var(--ink); opacity:0.35; }

  /* ── CARD STACK ── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 20px 16px;
    perspective: 1500px;
    min-height: 0;
  }

  .card-stack {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 500px;
  }

  .card-bg {
    position: absolute; inset: 0;
    background: var(--paper-deep);
    border-radius: 22px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .card-bg.deep { transform:translateY(12px) scale(0.96) rotate(-1.5deg); opacity:0.45; }
  .card-bg.mid  { transform:translateY(6px)  scale(0.98) rotate(0.8deg);  opacity:0.7; }

  .card {
    position: absolute; inset: 0;
    border-radius: 22px;
    box-shadow: 0 12px 32px var(--shadow-strong), 0 2px 6px var(--shadow);
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    padding: 24px;
    border-radius: 22px;
    overflow: hidden;
    transition: background 0.6s ease;
  }

  /* Default fronts */
  .card-front { background: linear-gradient(160deg, #fffaf4 0%, #fef3e8 100%); }
  .card-back  { transform: rotateY(180deg); background: linear-gradient(160deg, #fff5ee 0%, #fdeee2 100%); }

  /* Struggle tiers */
  .card-front.warn   { background: linear-gradient(160deg, #fff0ee, #fde0da); }
  .card-front.danger { background: linear-gradient(160deg, #ffd8d2, #f9c5bc); }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--ink);
    opacity: 0.4;
    text-transform: uppercase;
  }
  .card-meta-line { flex:1; height:1px; background:currentColor; margin:0 10px; opacity:0.3; }

  .card-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px 0;
  }

  .card-text-zh {
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.45;
    color: var(--ink);
    letter-spacing: 0.02em;
    word-break: break-word;
  }

  .card-text-en {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 28px;
    line-height: 1.3;
    color: var(--ink);
    letter-spacing: -0.01em;
    word-break: break-word;
  }

  .card-hint {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink);
    opacity: 0.38;
    text-align: center;
    letter-spacing: 0.05em;
  }

  /* struggle badge */
  .struggle-badge {
    position: absolute;
    top: 14px; right: 14px;
    font-size: 13px;
    opacity: 0.7;
  }

  /* ── CHEER CARD ── */
  .cheer-card {
    position: absolute; inset: 0;
    border-radius: 22px;
    background: linear-gradient(160deg, #fff5ee, #fde5d8);
    box-shadow: 0 12px 32px var(--shadow-strong);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px;
    text-align: center;
  }

  .cheer-corgi { width: 120px; height: 120px; }

  .cheer-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }

  .cheer-sub {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    opacity: 0.65;
    line-height: 1.6;
  }

  .cheer-btn {
    margin-top: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    cursor: pointer;
  }

  /* ── ACTIONS ── */
  .actions {
    padding: 0 20px 26px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .btn {
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.06em;
    padding: 15px 18px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .btn:active { transform: translateY(1px) scale(0.97); }

  .btn-forgot { background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
  .btn-forgot:active { background:rgba(224,90,58,0.07); }
  .btn-known  { background:var(--ink); color:var(--paper); border:1.5px solid var(--ink); }
  .btn-known:active  { background:var(--moss); border-color:var(--moss); }
  .btn-secondary { flex:1; background:transparent; color:var(--ink); border:1.5px solid rgba(45,36,32,0.2); }
  .btn-primary   { flex:1; background:var(--accent); color:var(--paper); border:1.5px solid var(--accent); }

  /* ── EMPTY STATE ── */
  .empty { text-align:center; padding:32px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty-corgi { width:90px; height:90px; opacity:0.8; }
  .empty-title { font-family:'Noto Serif SC',serif; font-size:20px; font-weight:500; }
  .empty-text  { font-family:'Fraunces',serif; font-style:italic; font-size:14px; opacity:0.6; line-height:1.6; }

  /* ── MODAL ── */
  .modal-backdrop {
    position:fixed; inset:0;
    background:rgba(45,36,32,0.38);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-backdrop.active { display:flex; animation:fadeIn 0.22s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .modal {
    background: var(--paper);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    border-radius: 24px 24px 0 0;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
    overflow-y: auto;
    animation: slideUp 0.33s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

  .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-title  { font-family:'Noto Serif SC',serif; font-weight:500; font-size:19px; }
  .modal-title em { font-family:'Fraunces',serif; font-style:italic; color:var(--accent); margin-right:5px; }
  .modal-section { margin-bottom:18px; }
  .modal-label {
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:0.15em;
    text-transform:uppercase; opacity:0.5; margin-bottom:7px;
  }

  textarea {
    width:100%; min-height:120px;
    padding:13px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; line-height:1.6;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(45,36,32,0.15);
    border-radius:12px;
    color:var(--ink);
    resize:vertical;
    -webkit-user-select:text; user-select:text;
  }
  textarea:focus { outline:none; border-color:var(--accent); }

  .modal-actions { display:flex; gap:10px; margin-top:14px; }

  .prompt-box {
    background:rgba(107,124,90,0.08);
    border-left:3px solid var(--moss);
    padding:12px 14px;
    border-radius:0 10px 10px 0;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; line-height:1.7;
    margin-bottom:10px;
    -webkit-user-select:text; user-select:text;
    max-height:180px; overflow-y:auto;
  }

  .copy-prompt-btn {
    background:var(--moss); color:var(--paper);
    border:none; padding:8px 14px;
    border-radius:8px; font-family:'Noto Serif SC',serif;
    font-size:13px; cursor:pointer; width:100%;
  }

  .deck-list { list-style:none; }
  .deck-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 12px;
    border-bottom:1px solid rgba(45,36,32,0.08);
  }
  .deck-item-zh { font-family:'Noto Serif SC',serif; font-size:14px; flex:1; margin-right:10px; }
  .deck-item-en { font-style:italic; font-size:13px; opacity:0.65; flex:1; }
  .deck-delete  { background:none; border:none; color:var(--accent); font-size:17px; cursor:pointer; padding:4px 8px; opacity:0.5; }

  /* ── TOAST ── */
  .toast {
    position:fixed;
    top: calc(18px + env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%) translateY(-70px);
    background:var(--ink); color:var(--paper);
    padding:11px 18px;
    border-radius:12px;
    font-family:'Noto Serif SC',serif; font-size:14px;
    z-index:200;
    transition:transform 0.28s cubic-bezier(0.2,0.8,0.2,1);
    box-shadow:0 8px 24px rgba(0,0,0,0.22);
    white-space:nowrap;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">

<script>
const STORAGE_KEY = 'hellowords_v1';
const ROLLBACK_DISTANCE = 8;
const CHEER_INTERVAL = 10; // show corgi every N words known in session

let state = {
  cards: [],
  queue: [],
  current: null,
  flipped: false,
  sessionKnown: 0,   // known count this session
  nextCheerAt: CHEER_INTERVAL, // trigger cheer at this milestone
  showingCheer: false
};

// ── STORAGE ──
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); state.cards = d.cards || []; }
  } catch(e) {}
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards: state.cards }));
}

// ── SESSION ──
function startSession() {
  state.sessionKnown = 0;
  state.nextCheerAt = CHEER_INTERVAL;
  state.showingCheer = false;
  // Reset all cards so every word appears again
  state.cards.forEach(c => { c.status = 'new'; });
  save();
  const due = state.cards.filter(c => c.status !== 'known');
  state.queue = due.map(c => c.id);
  for (let i = state.queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.queue[i], state.queue[j]] = [state.queue[j], state.queue[i]];
  }
  nextCard();
}

function nextCard() {
  state.flipped = false;
  state.showingCheer = false;
  if (!state.queue.length) { state.current = null; render(); return; }
  state.current = state.queue.shift();
  render();
}

function markForgot() {
  if (!state.current || state.showingCheer) return;
  const card = state.cards.find(c => c.id === state.current);
  if (card) { card.status = 'review'; card.seen = (card.seen || 0) + 1; card.forgot = (card.forgot || 0) + 1; }
  const pos = Math.min(ROLLBACK_DISTANCE, state.queue.length);
  state.queue.splice(pos, 0, state.current);
  save();
  nextCard();
}

function markKnown() {
  if (!state.current || state.showingCheer) return;
  const card = state.cards.find(c => c.id === state.current);
  if (card) { card.status = 'known'; card.seen = (card.seen || 0) + 1; }
  save();
  state.sessionKnown++;
  // Cheer milestone?
  if (state.sessionKnown >= state.nextCheerAt) {
    state.nextCheerAt += CHEER_INTERVAL;
    state.showingCheer = true;
    state.current = '__cheer__';
    renderCheer();
    return;
  }
  nextCard();
}

// ── STRUGGLE TIER ──
function getTier(card) {
  const f = card.forgot || 0;
  if (f >= 5) return 'danger';
  if (f >= 3) return 'warn';
  return '';
}

function getBadge(card) {
  const f = card.forgot || 0;
  if (f >= 5) return '🔴';
  if (f >= 3) return '🩷';
  return '';
}

// ── RENDER ──
function render() {
  const stack = document.getElementById('card-stack');
  const actions = document.getElementById('actions');

  const known   = state.cards.filter(c => c.status === 'known').length;
  const review  = state.cards.filter(c => c.status === 'review').length;
  const newC    = state.cards.filter(c => !c.status || c.status === 'new').length;
  document.getElementById('stat-queue').textContent  = newC;
  document.getElementById('stat-review').textContent = review;
  document.getElementById('stat-done').textContent   = known;

  if (!state.cards.length) {

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── IMPORT ──
function parseImport(text) {
  text = text.trim();
  if (!text) return [];
  try {
    let json = text
      .replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '')
      .replace(/[\u201c\u201d\u201e\u201f\u2033\u2036]/g, '"')
      .replace(/[\u2018\u2019\u201a\u201b\u2032\u2035]/g, "'");
    const arr = JSON.parse(json);
    if (Array.isArray(arr))
      return arr.filter(x => x.zh && x.en).map(x => ({ zh: String(x.zh).trim(), en: String(x.en).trim() }));
  } catch(e) {}
  return text.split('\n')
    .map(l => l.trim())
    .filter(l => l && (l.includes('|') || l.includes('｜') || l.includes('\t')))
    .map(l => { const p = l.split(/[|｜\t]/); return { zh: p[0].trim(), en: p.slice(1).join('|').trim() }; })
    .filter(x => x.zh && x.en);
}

function importCards(items) {
  let added = 0;
  items.forEach(i => {
    if (state.cards.some(c => c.en.toLowerCase() === i.en.toLowerCase())) return;
    state.cards.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2,8), zh: i.zh, en: i.en, status: 'new', seen: 0, forgot: 0 });
    added++;
  });
  save();
  return added;
}

// ── UI ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.getElementById('btn-add').addEventListener('click', () => openModal('modal-add'));
document.getElementById('btn-list').addEventListener('click', () => { renderDeckList(); openModal('modal-list'); });
document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', e => e.target.closest('.modal-backdrop').classList.remove('active')));
document.querySelectorAll('.modal-backdrop').forEach(el => el.addEventListener('click', e => { if (e.target === el) el.classList.remove('active'); }));

document.getElementById('copy-prompt').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('ai-prompt').textContent)
    .then(() => showToast('提示词已复制 ✓'));
});

document.getElementById('btn-import').addEventListener('click', () => {
  const items = parseImport(document.getElementById('import-text').value);
  if (!items.length) { showToast('未解析出有效词条'); return; }
  const added = importCards(items);
  document.getElementById('import-text').value = '';
  closeModal('modal-add');
  showToast(`已导入 ${added} 条，跳过 ${items.length - added} 重复`);
  startSession();
});

document.getElementById('btn-forgot').addEventListener('click', markForgot);
document.getElementById('btn-known').addEventListener('click', markKnown);

function renderDeckList() {
  const list = document.getElementById('deck-list');
  if (!state.cards.length) {
    list.innerHTML = '<li class="deck-item" style="opacity:.5;justify-content:center">暂无词条</li>';
    return;
  }
  list.innerHTML = state.cards.map(c => `
    <li class="deck-item" data-id="${c.id}">
      <span class="deck-item-zh">${esc(c.zh)}</span>
      <span class="deck-item-en">${esc(c.en)}</span>
      <button class="deck-delete" data-del="${c.id}">✕</button>
    </li>`).join('');
  list.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => {
    const id = e.target.dataset.del;
    state.cards = state.cards.filter(c => c.id !== id);
    save();
    renderDeckList();
    state.queue = state.queue.filter(q => q !== id);
    if (state.current === id) nextCard(); else render();
  }));
}

document.getElementById('btn-export').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(state.cards, null, 2))
    .then(() => showToast('备份已复制到剪贴板'));
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('重置所有学习进度？词条保留，进度清空。')) return;
  state.cards.forEach(c => { c.status = 'new'; c.seen = 0; c.forgot = 0; });
  save();
  closeModal('modal-list');
  startSession();
  showToast('进度已重置');
});

load();
startSession();
</script>
